{% extends "base.html" %}

{% block title %}My Profile | SkillSync{% endblock %}

{% block content %}

<div class="form-card wide-card">

    <h1>Your Student Profile</h1>

    <p class="muted">
        Keep your skills up to date to improve recommendations.
    </p>

    <form method="POST">

        <label for="name">Full name</label>

        <input
            id="name"
            name="name"
            value="{{ student['name'] }}"
            required
        >

        <label>Email address</label>

        <input value="{{ student['email'] }}" disabled>

        <label for="skills">Technical skills</label>

        <textarea
            id="skills"
            name="skills"
            placeholder="Python, Flask, SQL, HTML, CSS"
        >{{ student['skills'] }}</textarea>

        <small>
            Separate skills with commas.
        </small>

        <label for="interests">Interests</label>

        <textarea
            id="interests"
            name="interests"
            placeholder="Artificial intelligence, web development, hackathons"
        >{{ student['interests'] }}</textarea>

        <label for="availability">Availability</label>

        <select id="availability" name="availability">

            {% for option in ['Weekdays', 'Weekends', 'Flexible'] %}

                <option
                    value="{{ option }}"
                    {% if student['availability'] == option %}
                        selected
                    {% endif %}
                >
                    {{ option }}
                </option>

            {% endfor %}

        </select>

        <button type="submit" class="btn">
            Save Profile
        </button>

    </form>

</div>

{% endblock %}
