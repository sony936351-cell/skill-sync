{% extends "base.html" %}

{% block title %}Login | SkillSync{% endblock %}

{% block content %}

<div class="form-card">
    <h1>Welcome back</h1>

    <p class="muted">
        Log in to continue working on your projects.
    </p>

    <form method="POST">

        <label for="email">Email address</label>

        <input
            id="email"
            type="email"
            name="email"
            required
        >

        <label for="password">Password</label>

        <input
            id="password"
            type="password"
            name="password"
            required
        >

        <button type="submit" class="btn full-width">
            Login
        </button>

    </form>

    <p class="form-footer">
        Don't have an account?
        <a href="{{ url_for('register') }}">Register</a>
    </p>
</div>

{% endblock %}
